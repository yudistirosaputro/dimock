name: release
on:
  push:
    tags: ["v*"]

jobs:
  # Nothing is published until every version string in the repo matches the tag. A version that
  # reaches Maven Central can never be deleted or replaced, so this gate runs first and alone.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci || npm install
      - run: bash scripts/release/preflight.sh "${GITHUB_REF_NAME#v}"

  maven-central:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Publish AARs to Maven Central
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew --no-daemon --no-configuration-cache -PVERSION_NAME="${GITHUB_REF_NAME#v}" publishAndReleaseToMavenCentral

  npm:
    needs: preflight
    runs-on: ubuntu-latest
    permissions: { id-token: write, contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: "https://registry.npmjs.org" }
      - run: npm ci || npm install
      - run: npm run build
      - run: npm test
      - name: Publish dimock
        working-directory: packages/dimock
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
        # Moving a tag replays this job. npm rejects a version it already holds with a 403, and that
        # would block github-release, so a version already on the registry counts as published.
        run: |
          version="${GITHUB_REF_NAME#v}"
          if npm view "dimock@$version" version >/dev/null 2>&1; then
            echo "dimock@$version is already on the registry - nothing to publish."
          else
            npm publish --access public --provenance
          fi

  github-release:
    needs: [maven-central, npm]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
