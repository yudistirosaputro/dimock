name: release
on:
  push:
    tags: ["v*"]
jobs:
  maven-central:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Publish AARs to Maven Central
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew --no-daemon -PVERSION_NAME=${GITHUB_REF_NAME#v} publishAndReleaseToMavenCentral
  npm:
    runs-on: ubuntu-latest
    permissions: { id-token: write, contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: "https://registry.npmjs.org" }
      - run: npm ci || npm install
      - run: npm run build
      - name: Stamp version from tag
        run: |
          V=${GITHUB_REF_NAME#v}
          for p in packages/core packages/mcp packages/cli; do (cd $p && npm version "$V" --no-git-tag-version --allow-same-version); done
          node -e "const f='packages/cli/package.json';const j=require('./'+f);j.dependencies['@dimock/core']=process.env.V;j.dependencies['@dimock/mcp']=process.env.V;require('fs').writeFileSync(f,JSON.stringify(j,null,2)+'\n')" V=$V
          node -e "const f='packages/mcp/package.json';const j=require('./'+f);j.dependencies['@dimock/core']=process.env.V;require('fs').writeFileSync(f,JSON.stringify(j,null,2)+'\n')" V=$V
      - name: Publish @dimock/core, @dimock/mcp, dimock
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
        run: |
          (cd packages/core && npm publish --access public --provenance)
          (cd packages/mcp && npm publish --access public --provenance)
          (cd packages/cli && npm publish --access public --provenance)
  github-release:
    runs-on: ubuntu-latest
    needs: [maven-central, npm]
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - name: Marketplace manifest version check
        run: |
          V=${GITHUB_REF_NAME#v}
          grep -q "\"version\": \"$V\"" .claude-plugin/marketplace.json || { echo "bump .claude-plugin/marketplace.json and plugin/.claude-plugin/plugin.json to $V"; exit 1; }
      - uses: softprops/action-gh-release@v2
        with: { generate_release_notes: true }
